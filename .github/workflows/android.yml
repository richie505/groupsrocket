name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - "data/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APKs (Rocket Prep + Rocket Revision)
        working-directory: android
        run: ./gradlew assembleNotesRelease assembleReviseRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: rocket-mcq-apk
          path: |
            android/app/build/outputs/apk/notes/release/app-notes-release.apk
            android/app/build/outputs/apk/revise/release/app-revise-release.apk
